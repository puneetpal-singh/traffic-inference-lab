name: Quality checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - name: Audit published model and serving evidence (no GPU required)
        run: python scripts/audit_full_matrix.py --require-pipelines
      - name: Audit paired GPU confirmation evidence (no GPU required)
        run: python scripts/audit_confirmation.py
